services:
  task-tracker:
    build:
      context: .
      target: development
    image: task-tracker:dev
    container_name: task-tracker-dev
    command: npm run dev
    restart: unless-stopped
    environment:
      NODE_ENV: development
      PORT: "3000"
      DATABASE_URL: ${DATABASE_URL:-postgresql://dealgine:dealgine@postgres:5432/dealgine}
      APP_ORIGIN: ${APP_ORIGIN:-http://localhost:5173}
      VITE_API_PROXY: http://localhost:3000
      SESSION_TTL_DAYS: "30"
      PASSWORD_RESET_TTL_MINUTES: "30"
      SMTP_HOST: mailpit
      SMTP_PORT: "1025"
      SMTP_SECURE: "false"
      MAIL_FROM: "Dealgine <no-reply@localhost>"
    ports:
      - "${API_PORT:-3000}:3000"
      - "${APP_PORT:-5173}:5173"
    volumes:
      - .:/app
      - node_modules:/app/node_modules
      - client_node_modules:/app/client/node_modules
      - server_node_modules:/app/server/node_modules
    depends_on:
      postgres:
        condition: service_healthy
      mailpit:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "const net=require('net');const s=net.connect(3000,'127.0.0.1',()=>{s.end();process.exit(0)});s.on('error',()=>process.exit(1))"
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - development

  postgres:
    image: postgres:16-alpine
    container_name: dealgine-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-dealgine}
      POSTGRES_USER: ${POSTGRES_USER:-dealgine}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-dealgine}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_dev_data:/var/lib/postgresql/data
    healthcheck:
      test:
        - CMD-SHELL
        - "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - development

  mailpit:
    image: axllent/mailpit:latest
    container_name: dealgine-mailpit
    restart: unless-stopped
    ports:
      - "${MAILPIT_SMTP_PORT:-1025}:1025"
      - "${MAILPIT_WEB_PORT:-8025}:8025"
    healthcheck:
      test:
        - CMD
        - /mailpit
        - readyz
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    networks:
      - development

networks:
  development:

volumes:
  node_modules:
  client_node_modules:
  server_node_modules:
  postgres_dev_data:
