name: focus-grid

services:
  focus-grid:
    build:
      context: .
      target: production
    image: focus-grid:latest
    container_name: focus-grid
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: "3000"
      DATABASE_URL: ${DATABASE_URL:?Define DATABASE_URL en el archivo .env}
      APP_ORIGIN: ${APP_ORIGIN:-https://focus-grid.aseresoft.com}
      SESSION_TTL_DAYS: ${SESSION_TTL_DAYS:-30}
      PASSWORD_RESET_TTL_MINUTES: ${PASSWORD_RESET_TTL_MINUTES:-30}
      SMTP_HOST: ${SMTP_HOST:?Define SMTP_HOST en el archivo .env}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_SECURE: ${SMTP_SECURE:-false}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      MAIL_FROM: ${MAIL_FROM:-Focus Grid <no-reply@focus-grid.aseresoft.com>}
    expose:
      - "3000"
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "const net=require('net');const s=net.connect(3000,'127.0.0.1',()=>{s.end();process.exit(0)});s.on('error',()=>process.exit(1))"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    networks:
      - proxy
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.focus-grid.rule=Host(`focus-grid.aseresoft.com`)"
      - "traefik.http.services.focus-grid.loadbalancer.server.port=3000"

networks:
  proxy:
    external: true
    name: proxy
